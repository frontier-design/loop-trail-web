server {
    listen 80;
    server_name your-domain.com;

    root /path/to/loop-trail-web/dist;
    index index.html;

    # ----- Cache: hashed assets (JS, CSS) — immutable, 1 year -----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ----- Cache: fonts — immutable, 1 year -----
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ----- Cache: video/poster — 30 days, revalidate in background -----
    location /video/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # ----- SPA fallback — no cache on index.html -----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
