# ----- Redirect all HTTP to HTTPS -----
server {
    listen 80;
    server_name looptrail.ca www.looptrail.ca;
    return 301 https://$host$request_uri;
}

# =============================================================================
# Frontend: looptrail.ca  (static SPA served from dist/)
# =============================================================================
server {
    listen 443 ssl http2;
    server_name looptrail.ca www.looptrail.ca;

    # TLS certificates (adjust paths to your setup, e.g. Certbot):
    ssl_certificate     /etc/letsencrypt/live/looptrail.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/looptrail.ca/privkey.pem;

    root /path/to/loop-trail-web/dist;
    index index.html;

    # ----- Compression (BIGGEST first-load win) -----
    # Without this, bundles like vendor-maplibre (~1MB) ship uncompressed.
    # gzip cuts JS/CSS/JSON to roughly 1/4 of their size.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml
        font/woff
        font/woff2;

    # If the brotli module is installed (ngx_brotli), it compresses even better.
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml font/woff font/woff2;

    # ----- Cache: hashed assets (JS, CSS) — immutable, 1 year -----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ----- Cache: fonts — immutable, 1 year -----
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ----- Cache: video/poster — 30 days, immutable -----
    # Video URLs are versioned in the app (e.g. ?v=3), so the bytes behind a
    # given URL never change and can be cached immutably. When a video is
    # re-encoded, bump VIDEO_VERSION in src/hooks/useMobileVideo.js so the URL
    # changes — this avoids stale partial-range requests that return HTTP 416.
    location /video/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    # ----- SPA fallback — no cache on index.html -----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# =============================================================================
# CMS API: admin.looptrail.ca  (reverse proxy to Strapi)
# Adjust proxy_pass to wherever Strapi listens (e.g. http://127.0.0.1:1337).
# Define the cache zones once, at the http {} level (e.g. in nginx.conf):
#   proxy_cache_path /var/cache/nginx/api   levels=1:2 keys_zone=api_cache:10m   max_size=200m  inactive=10m;
#   proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media_cache:10m max_size=2g    inactive=30d;
# =============================================================================
server {
    listen 80;
    server_name admin.looptrail.ca;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.looptrail.ca;

    # TLS certificates (adjust paths to your setup, e.g. Certbot):
    ssl_certificate     /etc/letsencrypt/live/admin.looptrail.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.looptrail.ca/privkey.pem;

    # ----- Compression for API JSON responses -----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/plain;

    # ----- Cache: uploaded media (/uploads/*) -----
    # Strapi serves uploads with "Cache-Control: max-age=0", so without this the
    # browser re-downloads every image/logo on each page load — a major cause of
    # slow asset loading. Upload filenames contain a content hash, so they are
    # safe to cache long-term and treat as immutable. We ignore Strapi's headers
    # and set our own, and add an nginx-side cache so Strapi isn't hit each time.
    location /uploads/ {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache media_cache;
        proxy_cache_valid 200 206 30d;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        # Override Strapi's max-age=0 with a long, immutable cache.
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- Micro-cache GET /api/* so Strapi isn't hit on every visit -----
    # Honors the Cache-Control sent by the Strapi cache-headers middleware,
    # but also caps it here. Skips caching for draft/preview and authed admin calls.
    location /api/ {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache api_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        # Don't serve cached responses to authenticated/draft requests
        proxy_cache_bypass $http_authorization $arg_status;
        proxy_no_cache $http_authorization $arg_status;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
